<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="title description">
  <title id="title">Rubrik Product Management ShopEase</title>
  <desc id="description">Tujuh komponen rubrik HOL dengan bobot dan penerapannya pada ShopEase Pertemuan 12.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .card-title { font-size: 25px; font-weight: 700; fill: #142D4E; }
    .weight { font-size: 19px; font-weight: 700; fill: #8A3508; }
    .body { font-size: 19px; fill: #384D65; }
    .source { font-size: 17px; fill: #384D65; }
  </style>
  <rect width="1200" height="830" fill="#F8FAFC"/>
  <rect width="1200" height="159" fill="#142D4E"/>
  <rect x="44" y="36" width="5" height="88" rx="2" fill="#F97316"/>
  <text x="66" y="59" fill="#F9C6A4" font-size="19" font-weight="600">ShopEase · Praktikum PBKK Pertemuan 12</text>
  <text x="65" y="111" fill="#FFFFFF" font-size="44" font-weight="700">Rubrik Product Management</text>
  <text x="1155" y="110" text-anchor="end" fill="#E4EDF8" font-size="19">Total bobot 100%</text>
  <g transform="translate(44 193)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Database dan ERD</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">15%</text>
    <text x="24" y="79" class="body">Empat tabel, foreign key, serta</text>
    <text x="24" y="105" class="body">aturan RESTRICT dan CASCADE.</text>
  </g>
  <g transform="translate(610 193)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Model dan Controller</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">20%</text>
    <text x="24" y="79" class="body">Model CI4 mengakses MySQL.</text>
    <text x="24" y="105" class="body">Controller memproses input dan mengirim View.</text>
  </g>
  <g transform="translate(44 345)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Implementasi CRUD</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">25%</text>
    <text x="24" y="79" class="body">Pengelolaan kategori dan produk,</text>
    <text x="24" y="105" class="body">harga, stok, status, serta filter katalog.</text>
  </g>
  <g transform="translate(610 345)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Desain UI/UX</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">15%</text>
    <text x="24" y="79" class="body">Dashboard sesuai peran, formulir,</text>
    <text x="24" y="105" class="body">tabel responsif, dan galeri produk.</text>
  </g>
  <g transform="translate(44 497)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Upload gambar</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">10%</text>
    <text x="24" y="79" class="body">JPEG, PNG, WebP. Hingga empat</text>
    <text x="24" y="105" class="body">gambar per produk dan satu gambar utama.</text>
  </g>
  <g transform="translate(610 497)">
    <rect width="546" height="132" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Validasi dan keamanan</text>
    <rect x="450" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="486" y="42" text-anchor="middle" class="weight">10%</text>
    <text x="24" y="79" class="body">Hash password, CSRF, AuthFilter,</text>
    <text x="24" y="105" class="body">validasi file, serta cleanup upload.</text>
  </g>
  <g transform="translate(44 650)">
    <rect width="1112" height="104" rx="7" fill="#FFFFFF" stroke="#D4DFEC"/>
    <rect x="0" y="21" width="4" height="36" rx="2" fill="#F97316"/>
    <text x="24" y="42" class="card-title">Pengujian aplikasi</text>
    <rect x="1016" y="20" width="72" height="32" rx="5" fill="#FFF0E5"/>
    <text x="1052" y="42" text-anchor="middle" class="weight">5%</text>
    <text x="24" y="79" class="body">PHPUnit, integrasi HTTP per peran, dan Chrome pada 390, 768, serta 1280 piksel.</text>
  </g>
  <line x1="44" y1="779" x2="1156" y2="779" stroke="#D4DFEC"/>
  <text x="44" y="808" class="source">Sumber · HOL Product Management ShopEase CI4, bagian Q. Bobot mengikuti rubrik praktikum.</text>
</svg>
